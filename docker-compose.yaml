version: '3.8'

services:
  web:
    build: .
    container_name: sekolah_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: db_sekolah
      DB_USER: user_sekolah
      DB_PASS: pass_sekolah_123

  db:
    image: mysql:8.0
    container_name: sekolah_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: db_sekolah
      MYSQL_USER: user_sekolah
      MYSQL_PASSWORD: pass_sekolah_123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sekolah_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: